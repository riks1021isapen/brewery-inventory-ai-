<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>樽管理サイト</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>🍺 樽管理ダッシュボード</h1>
        <p>在庫・状態・返却期限を一元管理します。</p>
      </header>

      <section class="card form-card">
        <h2>樽を登録</h2>
        <form id="keg-form">
          <label>
            樽ID
            <input id="keg-id" required placeholder="KEG-1001" />
          </label>
          <label>
            ビール名
            <input id="beer-name" required placeholder="IPA" />
          </label>
          <label>
            容量(L)
            <input id="capacity" type="number" min="5" value="20" required />
          </label>
          <label>
            ステータス
            <select id="status">
              <option value="IN_STOCK">在庫</option>
              <option value="IN_USE">使用中</option>
              <option value="CLEANING">洗浄中</option>
              <option value="RETURN_DUE">返却待ち</option>
            </select>
          </label>
          <label>
            返却期限
            <input id="due-date" type="date" required />
          </label>
          <button type="submit">登録する</button>
        </form>
      </section>

      <section class="card">
        <h2>樽一覧</h2>
        <table>
          <thead>
            <tr>
              <th>樽ID</th>
              <th>ビール名</th>
              <th>容量</th>
              <th>ステータス</th>
              <th>返却期限</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="keg-table-body"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
